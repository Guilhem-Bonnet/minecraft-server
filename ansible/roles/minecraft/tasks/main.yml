---
# Minecraft Server - Main Tasks
# Déploiement complet du serveur Minecraft avec Docker

- name: Include Docker installation
  ansible.builtin.include_tasks: docker.yml
  when: docker_install | bool

- name: Create minecraft user
  ansible.builtin.user:
    name: "{{ minecraft_user }}"
    group: "{{ minecraft_group }}"
    system: true
    home: "{{ minecraft_base_dir }}"
    shell: /bin/bash
    create_home: true
  become: true

- name: Create directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ minecraft_user }}"
    group: "{{ minecraft_group }}"
    mode: "0755"
  loop:
    - "{{ minecraft_base_dir }}"
    - "{{ minecraft_data_dir }}"
    - "{{ minecraft_config_dir }}"
    - "{{ minecraft_scripts_dir }}"
    - "{{ minecraft_base_dir }}/docker"
    - "{{ minecraft_base_dir }}/docker/infrared"
    - "{{ minecraft_base_dir }}/mods"
    - "{{ minecraft_base_dir }}/plugins"
    - "{{ minecraft_base_dir }}/modpack"
  become: true

- name: Deploy Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ minecraft_base_dir }}/docker/docker-compose.yml"
    owner: "{{ minecraft_user }}"
    group: "{{ minecraft_group }}"
    mode: "0644"
  become: true
  notify: Restart minecraft stack

- name: Deploy environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ minecraft_base_dir }}/docker/.env"
    owner: "{{ minecraft_user }}"
    group: "{{ minecraft_group }}"
    mode: "0600"
  become: true
  notify: Restart minecraft stack

- name: Deploy Infrared configuration
  ansible.builtin.template:
    src: infrared-config.yml.j2
    dest: "{{ minecraft_base_dir }}/docker/infrared/config.yml"
    owner: "{{ minecraft_user }}"
    group: "{{ minecraft_group }}"
    mode: "0644"
  become: true
  when: infrared_enabled | bool
  notify: Restart infrared

- name: Include backup tasks
  ansible.builtin.include_tasks: backup.yml
  when: backup_enabled | bool

- name: Include monitoring tasks
  ansible.builtin.include_tasks: monitoring.yml
  when: prometheus_enabled | bool

- name: Include packwiz tasks
  ansible.builtin.include_tasks: packwiz.yml
  when: packwiz_enabled | bool

- name: Start minecraft stack
  community.docker.docker_compose_v2:
    project_src: "{{ minecraft_base_dir }}/docker"
    state: present
  become: true
  become_user: "{{ minecraft_user }}"

- name: Ensure Infrared is running (Minecraft starts on demand)
  community.docker.docker_container_info:
    name: infrared
  register: infrared_info
  become: true

- name: Display connection info
  ansible.builtin.debug:
    msg: |
      =============================================
      🎮 Serveur Minecraft déployé avec succès!
      =============================================
      
      Connexion: {{ infrared_domains | first }}:{{ minecraft_port }}
      
      Le serveur démarre automatiquement quand un joueur se connecte
      et s'arrête après {{ infrared_autostop_timeout // 60 }} minutes d'inactivité.
      
      Commandes utiles:
        cd {{ minecraft_base_dir }}/docker
        docker compose logs -f minecraft
        docker compose exec minecraft rcon-cli
      
      Backup:
        {{ minecraft_scripts_dir }}/backup.sh list
        {{ minecraft_scripts_dir }}/backup.sh --tag manual
      =============================================
